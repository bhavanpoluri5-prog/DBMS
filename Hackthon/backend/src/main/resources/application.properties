server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/autocare_pro?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Hibernate creates/updates tables to match entities (database/schema.sql documents the same design)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT (HS256 needs a secret of 32+ characters; override with env var outside local demo)
app.jwt.secret=${JWT_SECRET:autocare-pro-local-demo-secret-key-change-me-0123456789}
app.jwt.expiration-ms=86400000

# CORS: React dev server (Vite)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
